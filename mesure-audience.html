<script>
(() => {
const strings={
fr:["Mesure d’audience et cookies","Cette page concerne uniquement les sites Web de GogoStudio.app (Stopododo, ClikoSpido et ZAPIKI). Les applications Android ont leurs propres politiques de confidentialité.","Pourquoi des statistiques ?","Avec votre accord, nous utilisons Google Analytics 4 pour connaître les visites, les pages consultées, la provenance générale du trafic et les clics vers les fiches Google Play de nos trois applications. Il n’y a pas de publicité ni de suivi publicitaire sur ce site.","Quels cookies et données ?","Google Analytics peut utiliser les cookies _ga et _ga_* (durée configurée : environ 13 mois) et traiter des données de navigation, des informations techniques sur l’appareil et une zone géographique approximative. Le prestataire est Google ; des données peuvent être traitées hors de l’Union européenne selon ses conditions.","Consentement et retrait","Google Analytics n’est chargé qu’après votre accord explicite. Refuser n’empêche pas d’utiliser le site. Votre choix est conservé localement pendant six mois. Vous pouvez le modifier à tout moment avec le bouton « Gérer les cookies » en pied de page. En cas de retrait, nous supprimons les cookies Analytics accessibles depuis ce domaine.","Vos droits et contact","Vous pouvez exercer vos droits de protection des données auprès de GogoStudio.app à l’adresse ci-dessous. Les durées de conservation des données reçues par Google Analytics dépendent également des paramètres de la propriété Analytics.","Politique de confidentialité de Google"],
en:["Audience measurement and cookies","This notice applies only to GogoStudio.app websites (Stopododo, ClikoSpido and ZAPIKI). The Android apps have separate privacy policies.","Why analytics?","Only with your permission, we use Google Analytics 4 to measure visits, viewed pages, general traffic sources and clicks to the Google Play listings of our three apps. We do not display advertising or use ad tracking on this website.","What cookies and data?","Google Analytics may set _ga and _ga_* cookies (configured lifetime: about 13 months) and process browsing events, device technical information and approximate geographic location. Google is the provider and may process information outside the European Union under its terms.","Consent and withdrawal","Google Analytics is loaded only after explicit consent. Declining does not limit your use of this website. Your preference is stored locally for six months. You may change it using the Cookie settings button in the footer; withdrawing consent clears accessible Analytics cookies on this domain.","Your rights and contact","To exercise data protection rights, contact GogoStudio.app at the email below. Data retention within Google Analytics also depends on property configuration.","Google privacy policy"],
es:["Medición de audiencia y cookies","Este aviso se aplica solo a los sitios web de GogoStudio.app, no a las aplicaciones Android.","¿Para qué sirven las estadísticas?","Con tu consentimiento, Google Analytics 4 mide las visitas, las páginas vistas, el origen general del tráfico y los clics hacia Google Play. Sin publicidad ni seguimiento publicitario.","Cookies y datos","Google Analytics puede usar cookies _ga y _ga_* (aproximadamente 13 meses), datos de navegación, datos técnicos del dispositivo y una ubicación aproximada. Google puede tratar datos fuera de la UE.","Consentimiento y retirada","Solo se carga Analytics si aceptas. Puedes rechazarlo sin perder acceso. Guardamos tu elección localmente durante seis meses; puedes cambiarla en el pie de página mediante la configuración de cookies.","Derechos y contacto","Para ejercer tus derechos de protección de datos, escribe a GogoStudio.app. La conservación en Analytics depende también de la configuración de Google.","Privacidad de Google"],
it:["Misurazione delle visite e cookie","L’informativa riguarda solo i siti GogoStudio.app e non le app Android.","Perché le statistiche?","Con il tuo consenso, Google Analytics 4 misura le visite, le pagine viste, le fonti di traffico generali e i clic verso Google Play. Nessuna pubblicità o tracciamento pubblicitario.","Cookie e dati","Analytics può usare i cookie _ga e _ga_* (circa 13 mesi), dati di navigazione, dati tecnici del dispositivo e posizione approssimativa. Google può elaborare dati fuori dall’UE.","Consenso e revoca","Analytics viene caricato solo dopo il consenso. Puoi rifiutare senza limitazioni. La scelta viene conservata localmente per sei mesi e può essere modificata dal piè di pagina.","Diritti e contatto","Per i tuoi diritti sulla protezione dei dati contatta GogoStudio.app. La conservazione dei dati Analytics dipende anche dalle impostazioni di Google.","Privacy di Google"],
de:["Besuchermessung und Cookies","Dieser Hinweis betrifft nur die Webseiten von GogoStudio.app, nicht die Android-Apps.","Warum Statistiken?","Mit Ihrer Einwilligung misst Google Analytics 4 Besuche, Seitenaufrufe, allgemeine Traffic-Quellen und Klicks zu Google Play. Keine Werbung und kein Werbetracking.","Cookies und Daten","Analytics kann _ga- und _ga_*-Cookies (etwa 13 Monate), Nutzungsereignisse, Gerätedaten und ungefähren Standort verarbeiten. Google kann Daten außerhalb der EU verarbeiten.","Einwilligung und Widerruf","Analytics wird nur mit ausdrücklicher Zustimmung geladen. Eine Ablehnung schränkt die Seite nicht ein. Ihre Wahl wird sechs Monate lokal gespeichert und kann über die Cookie-Einstellungen im Footer geändert werden.","Ihre Rechte und Kontakt","Wenden Sie sich für Datenschutzrechte an GogoStudio.app. Die Aufbewahrung in Analytics hängt auch von den Einstellungen bei Google ab.","Datenschutz bei Google"],
nl:["Bezoekersmeting en cookies","Deze informatie geldt alleen voor de GogoStudio.app-websites, niet voor de Android-apps.","Waarom statistieken?","Met uw toestemming meet Google Analytics 4 bezoeken, paginaweergaven, algemene verkeersbronnen en klikken naar Google Play. Geen reclame of advertentietracking.","Cookies en gegevens","Analytics kan _ga- en _ga_*-cookies (circa 13 maanden), browsegegevens, technische apparaatinfo en een globale locatie verwerken. Google kan gegevens buiten de EU verwerken.","Toestemming en intrekken","Analytics wordt pas na toestemming geladen. Weigeren beperkt uw gebruik niet. Uw keuze wordt zes maanden lokaal bewaard en kan in de footer worden gewijzigd.","Uw rechten en contact","Neem voor privacyrechten contact op met GogoStudio.app. Bewaring in Analytics hangt ook af van de Google-instellingen.","Privacybeleid van Google"],
pt:["Medição de audiência e cookies","Este aviso aplica-se apenas aos sites GogoStudio.app, não às aplicações Android.","Porquê estatísticas?","Com o seu consentimento, Google Analytics 4 mede visitas, páginas vistas, origem geral do tráfego e cliques para Google Play. Sem publicidade ou rastreamento publicitário.","Cookies e dados","Analytics pode usar cookies _ga e _ga_* (cerca de 13 meses), dados de navegação, dados técnicos e localização aproximada. Google pode tratar dados fora da UE.","Consentimento e retirada","Analytics só é carregado após consentimento expresso. Recusar não limita o site. A escolha fica guardada localmente por seis meses e pode ser alterada no rodapé.","Direitos e contacto","Para exercer direitos de proteção de dados, contacte GogoStudio.app. A retenção no Analytics depende também das definições da Google.","Privacidade da Google"],
ar:["قياس الزيارات وملفات الارتباط","تخص هذه المعلومات مواقع GogoStudio.app فقط، وليس تطبيقات Android.","لماذا الإحصاءات؟","بموافقتك، يستخدم الموقع Google Analytics 4 لقياس الزيارات والصفحات ومصادر الزيارات العامة والنقرات إلى Google Play. لا إعلانات أو تتبع إعلاني.","البيانات وملفات الارتباط","قد يستخدم Analytics ملفات _ga و _ga_* لمدة نحو 13 شهرًا ويعالج بيانات التصفح والجهاز والموقع التقريبي. قد تعالج Google البيانات خارج الاتحاد الأوروبي.","الموافقة وسحبها","لا يتم تحميل Analytics إلا بعد موافقتك الصريحة. يمكنك الرفض دون التأثير على استخدام الموقع. يُحفظ اختيارك محليًا لستة أشهر ويمكن تغييره من تذييل الصفحة.","حقوقك والتواصل","لممارسة حقوق حماية البيانات، تواصل مع GogoStudio.app. تعتمد مدة احتفاظ Google Analytics بالبيانات أيضًا على إعداداته.","خصوصية Google"],
ja:["アクセス解析とCookie","この案内はGogoStudio.appのWebサイトのみを対象とし、Androidアプリには適用されません。","解析の目的","同意された場合に限り、Google Analytics 4で訪問数、閲覧ページ、流入経路、Google Playへのクリックを測定します。広告や広告目的の追跡はありません。","Cookieとデータ","Analyticsは_gaと_ga_*のCookie（約13か月）を使用し、閲覧情報、端末情報、おおよその地域を処理する場合があります。GoogleがEU域外で処理する場合があります。","同意と撤回","明示的な同意後にのみAnalyticsを読み込みます。拒否しても利用は制限されません。選択は6か月間端末に保存され、フッターから変更できます。","権利とお問い合わせ","個人情報に関する権利の行使はGogoStudio.appにご連絡ください。Analytics内の保持期間はGoogleの設定にも依存します。","Googleプライバシーポリシー"],
ko:["방문 통계 및 쿠키","이 안내는 GogoStudio.app 웹사이트에만 적용되며 Android 앱에는 적용되지 않습니다.","통계 목적","동의한 경우에만 Google Analytics 4로 방문, 페이지 조회, 일반 유입 경로 및 Google Play 클릭을 측정합니다. 광고나 광고 추적은 없습니다.","쿠키와 데이터","Analytics는 _ga 및 _ga_* 쿠키(약 13개월)를 사용하며 탐색 기록, 기기 정보, 대략적 위치를 처리할 수 있습니다. Google이 EU 외부에서 처리할 수 있습니다.","동의 및 철회","명시적 동의 후에만 Analytics를 불러옵니다. 거부해도 사이트 이용에 제한이 없습니다. 선택은 6개월간 로컬에 저장되며 바닥글에서 변경할 수 있습니다.","권리 및 연락처","개인정보 보호 권리 행사는 GogoStudio.app에 문의하세요. Analytics 데이터 보존은 Google 설정에도 따릅니다.","Google 개인정보처리방침"]
};
function setLanguage(lang){
  const s=strings[lang]||strings.fr;
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.getElementById("language").value=lang;
  ["title","intro","section1","p1","section2","p2","section3","p3","section4","p4","googlePolicy"].forEach((id,i)=>{document.getElementById(id).textContent=s[i];});
  document.title=s[0]+" — GogoStudio.app";
}
const query=new URLSearchParams(location.search).get("lang");
const lang=Object.prototype.hasOwnProperty.call(strings,query)?query:"fr";
setLanguage(lang);
document.getElementById("language").addEventListener("change",e=>{
  const url=new URL(location.href);url.searchParams.set("lang",e.target.value);location.href=url.toString();
});
})();
</script>
</body>
</html>
